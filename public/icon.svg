<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#E00000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E00000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#starGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Star Symbol -->
  <g filter="url(#shadow)">
    <path d="M 256,70 
             L 315,188 
             L 446,206 
             L 351,298 
             L 374,428 
             L 256,366 
             L 138,428 
             L 161,298 
             L 66,206 
             L 197,188 Z" 
          fill="url(#starGrad)" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linejoin="round" />
  </g>

  <!-- Tech Core Dot -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="14" fill="#E00000" />
</svg>
